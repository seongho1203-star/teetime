apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.kkakkung.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kkakkung.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /* **판 번호는 워크플로가 준다**(`.github/workflows/android.yml`) —
           아이폰의 `CURRENT_PROJECT_VERSION`과 같은 자리다.
           `versionCode`는 **올릴 때마다 커져야 한다**(같거나 작으면 구글이
           거절한다). 손으로 적지 말 것 — `github.run_number`가 저절로 오른다.
           안 주면 1.0으로, 폰에 직접 꽂아 볼 때 쓴다. */
        versionCode project.hasProperty('appVersionCode') ? appVersionCode.toInteger() : 1
        versionName project.hasProperty('appVersionName') ? appVersionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SUPABASE_URL", '"' + (System.getenv('VITE_SUPABASE_URL') ?: '') + '"'
        buildConfigField "String", "SUPABASE_ANON_KEY", '"' + (System.getenv('VITE_SUPABASE_ANON_KEY') ?: '') + '"'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* ── 서명 ───────────────────────────────────────────────────
     *
     * **열쇠는 저장소에 안 둔다.** 워크플로가 비밀값에서 꺼내 파일로 놓고
     * 그 자리를 환경변수로 알려 준다 — 아이폰이 `.p8`을 그렇게 다루는 것과
     * 같은 방식이다.
     *
     * **없으면 서명을 안 한다.** 그때는 서명 안 된 결과물이 나오는데,
     * 폰에 직접 넣어 보는 데는 그걸로 충분하고 **비밀값이 아직 없다고
     * 빌드가 빨갛게 되면 안 된다**(아이폰 워크플로와 같은 규칙).
     */
    signingConfigs {
        release {
            def path = System.getenv('ANDROID_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    /* Android Native V2는 Capacitor 설정에 기대지 않고 JVM 21을 직접 고정한다. */
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    buildFeatures { buildConfig true }

    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    /* ── 코틀린 대화 화면(`chat/`)이 쓰는 것 ──
       - recyclerview: 말풍선 목록.
       - coroutines: 통신을 딴 갈래에서.
       - okhttp: REST와 실시간(WebSocket) — Capacitor에 딸려 오지 않는다.
       - coil(+gif): 얼굴·사진·이모티콘 그림. `coil-gif`가 **움직이는 webp**를
         푼다(안드로이드 9부터. 그 아래는 멈춘 png를 그대로 쓴다). */
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.25"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation "io.coil-kt:coil:2.7.0"
    implementation "io.coil-kt:coil-gif:2.7.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}


try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
