<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- viewport-fit=cover: 아이폰 노치 아래까지 배경이 깔린다.
         safe-area-inset-* 값도 이게 있어야 채워진다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f1" />
    <meta name="description" content="골프 모임 라운드 모집 · 투표 · 공지" />

    <!-- 홈 화면에 추가하면 사파리 막대 없이 앱처럼 뜬다.
         상단이 뿌옇던 것이 그 막대였다.

         상태바는 **black**이다. black-translucent도 써 봤는데, 페이지를
         상태바 아래까지 늘리면서 바닥 계산이 어긋나 **탭바가 화면 바닥에서
         70pt쯤 떠 버렸다.** black이면 iOS가 상태바 자리를 따로 잡아 주므로
         그 어긋남이 없고, 검은 띠라 뿌옇지도 않다.
         이 값들은 홈 화면에 **추가할 때 한 번만** 읽힌다 — 고치면 아이콘을
         지우고 다시 추가해야 반영된다. -->
    <!-- 제목에 쓰는 통통한 글씨. 아이콘의 `까꿍` 글자와 같은 결이다.
         한글 웹폰트는 무거워서 제목에만 쓰고, 본문은 시스템 글꼴 그대로다.
         구글이 쓰는 글자 범위별로 잘라 보내므로 실제로 받는 양은 적다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="까꿍" />
    <title>까꿍</title>

    <!-- 첫 화면(스플래시).
         **여기 인라인으로 두는 이유가 있다.** 이 그림은 CSS 파일과
         자바스크립트가 도착하기 **전에** 떠 있어야 한다 — 밖에 두면 그때까지
         빈 화면이라, 없애려던 그 순간이 그대로 남는다.
         React가 뜬 뒤의 로딩 화면(App.tsx의 Gate)도 **같은 `.boot`를 쓴다.**
         `<style>`은 문서에 계속 남아 있으므로 규칙을 한 번만 적으면 된다 —
         global.css에 또 만들지 말 것. 두 벌이 되면 한쪽만 고치게 된다.
         바탕이 흰색인 것은 아이콘(스티커)의 바탕이 흰색이라 그렇다.
         `--bg`(살짝 초록빛)로 두면 그림 둘레에 네모난 자국이 보인다. -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff;
        z-index: 1;
      }
      .boot img {
        width: 200px;
        max-width: 52vw;
        /* 아주 잠깐 뜨는 화면이라 첫 프레임부터 보이면 번쩍인다.
           살짝 늦게 떠올라야 눈에 편하다. */
        animation: boot-in 0.5s ease both;
      }
      @keyframes boot-in {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <!-- 자바스크립트가 도착하기 전까지 이게 보인다. React가 뜨면
         `#root` 내용을 통째로 갈아 끼우므로 따로 지울 필요가 없다. -->
    <div id="root">
      <div class="boot"><img src="./icon-512.png" alt="까꿍" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
