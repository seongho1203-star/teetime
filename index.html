<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#a50034" />
    <meta name="description" content="LG전자 가전수리 엔지니어를 위한 모델별 점검 방법과 현장 노하우 공유 앱" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="수리노트" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./repair-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./repair-icon-192.png" />
    <title>수리노트 | 가전수리 지식 공유</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f5f7f8; color: #263440; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .boot { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 16px; color: #a50034; font-weight: 750; }
      .boot-mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 18px; background: #a50034; color: white; box-shadow: 0 12px 28px #a5003430; }
      .boot-mark svg { width: 27px; height: 27px; }
      .boot small { color: #77838b; font-size: 12px; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <span class="boot-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a5 5 0 0 0-6.7 6.7L3 18l3 3 4.8-4.8a5 5 0 0 0 6.7-6.7L14 13l-3-3z"/><path d="m14 6 4-4 4 4-4 4"/></svg></span>
        <span>수리노트</span>
        <small>현장 기술 지식을 불러오는 중입니다.</small>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
