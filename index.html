<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- viewport-fit=cover: 아이폰 노치 아래까지 배경이 깔린다.
         safe-area-inset-* 값도 이게 있어야 채워진다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f1" />
    <meta name="description" content="골프 모임 라운드 모집 · 투표 · 공지" />

    <!-- 홈 화면에 추가하면 사파리 막대 없이 앱처럼 뜬다.
         상단이 뿌옇던 것이 그 막대였다.

         상태바는 **black**이다. black-translucent도 써 봤는데, 페이지를
         상태바 아래까지 늘리면서 바닥 계산이 어긋나 **탭바가 화면 바닥에서
         70pt쯤 떠 버렸다.** black이면 iOS가 상태바 자리를 따로 잡아 주므로
         그 어긋남이 없고, 검은 띠라 뿌옇지도 않다.
         이 값들은 홈 화면에 **추가할 때 한 번만** 읽힌다 — 고치면 아이콘을
         지우고 다시 추가해야 반영된다. -->
    <!-- 제목에 쓰는 통통한 글씨. 아이콘의 `까꿍` 글자와 같은 결이다.
         한글 웹폰트는 무거워서 제목에만 쓰고, 본문은 시스템 글꼴 그대로다.
         구글이 쓰는 글자 범위별로 잘라 보내므로 실제로 받는 양은 적다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="까꿍" />
    <title>까꿍</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
