    <!-- 홈 화면에 추가하면 사파리 막대 없이 앱처럼 뜬다.
         상단이 뿌옇던 것이 그 막대였다.

         상태바는 **black**이다. black-translucent도 써 봤는데, 페이지를
         상태바 아래까지 늘리면서 바닥 계산이 어긋나 **탭바가 화면 바닥에서
         70pt쯤 떠 버렸다.** black이면 iOS가 상태바 자리를 따로 잡아 주므로
         그 어긋남이 없고, 검은 띠라 뿌옇지도 않다.
         이 값들은 홈 화면에 **추가할 때 한 번만** 읽힌다 — 고치면 아이콘을
         지우고 다시 추가해야 반영된다. -->
    <!-- 제목에 쓰는 통통한 글씨. 아이콘의 `까꿍` 글자와 같은 결이다.
         한글 웹폰트는 무거워서 제목에만 쓰고, 본문은 시스템 글꼴 그대로다.
         구글이 쓰는 글자 범위별로 잘라 보내므로 실제로 받는 양은 적다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="까꿍" />
    <title>까꿍</title>

    <!-- 첫 화면(스플래시).
         **여기 인라인으로 두는 이유가 있다.** 이 그림은 CSS 파일과
         자바스크립트가 도착하기 **전에** 떠 있어야 한다 — 밖에 두면 그때까지
         빈 화면이라, 없애려던 그 순간이 그대로 남는다.
         React가 뜬 뒤의 로딩 화면(App.tsx의 Gate)도 **같은 `.boot`를 쓴다.**
         `<style>`은 문서에 계속 남아 있으므로 규칙을 한 번만 적으면 된다 —
         global.css에 또 만들지 말 것. 두 벌이 되면 한쪽만 고치게 된다.
         바탕이 흰색인 것은 아이콘(스티커)의 바탕이 흰색이라 그렇다.
         `--bg`(살짝 초록빛)로 두면 그림 둘레에 네모난 자국이 보인다. -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff;
        z-index: 1;
      }
      /* **그림을 파일로 부르지 않고 여기 박아 둔다.** 파일로 두면 문서를 받고
         나서 한 번 더 다녀와야 해서, LTE에서 흰 화면이 먼저 보이고 조금 뒤에
         그림이 떴다. 지금은 문서와 함께 오므로 첫 프레임부터 있다.
         (원본 512 PNG는 200KB라 못 박는다. 400px WebP로 줄여 15KB다.)
         `::before`로 두는 것도 이유가 있다 — 이러면 React 쪽 로딩 화면이
         `<div class="boot">` 하나만 그려도 같은 그림이 나와서, 그림이
         자바스크립트 묶음에 **또 들어가지 않는다.**
         나타나는 연출은 안 넣는다. 첫 프레임에 보이는 것이 이 화면의 전부라
         0.5초 동안 서서히 뜨게 하면 없애려던 그 흰 화면이 그대로 남는다. */
