<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- viewport-fit=cover: 아이폰 노치 아래까지 배경이 깔린다.
         safe-area-inset-* 값도 이게 있어야 채워진다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="골프 모임 라운드 모집 · 투표 · 공지" />

    <!-- 홈 화면에 추가하면 사파리 막대 없이 앱처럼 뜬다.
         상단이 뿌옇게 보이던 것이 그 막대라, 이렇게 두는 편이 깔끔하다.
         black-translucent면 상태바 뒤도 우리 바탕색이 된다 —
         글이 그 아래로 지나가지 않게 global.css가 띠를 하나 깔아 둔다. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="teetime" />
    <title>teetime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
