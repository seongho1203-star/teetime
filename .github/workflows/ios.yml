name: 아이폰 앱 (TestFlight)

# 맥 없이 아이폰 앱을 만들어 TestFlight로 보낸다.
# **저장소가 공개라 GitHub의 macOS 러너가 공짜다** — 그게 맥을 안 사도 되는
# 까닭이다. 절차와 넣을 비밀값은 `docs/출시-전-할일.md` 0-3번에 있다.
#
# **이제는 화면 고침도 이걸 돌려야 앱에 닿는다.** 출시용으로 바꾸면서
# `npm run build`가 만든 `dist`가 앱 안에 담기게 됐다(`capacitor.config.ts`의
# `server` 덩어리를 지웠다) — 밀기만 하면 폰에 바로 보이던 때와 다르다.
# 그래서 `paths`에 없는 파일만 고쳤을 때는 **손으로 돌려야 한다**
# (Actions 탭 → 이 워크플로 → Run workflow). 웹(GitHub Pages)은 예전처럼
# 밀면 저절로 올라간다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

# 두 판이 겹치면 TestFlight에 같은 번호가 두 번 올라가 뒤엣것이 거절된다.
concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # **비밀값이 없으면 조용히 지나간다** — 아직 안 넣어 두었을 때
      # 빨간 X만 쌓이면 안 된다. 다만 단추를 눌러 손으로 돌린 것은
      # 알고 싶어서 누른 것이므로 그때는 또렷이 알린다.
      - id: keys
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::애플 비밀값 넷이 다 있어야 합니다 (APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8 · APPLE_TEAM_ID). docs/출시-전-할일.md 0-3번 참고."
            exit 1
          else
            echo "::notice::애플 비밀값이 아직 없어 건너뜁니다."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.keys.outputs.ready == 'yes'
        with:
          node-version: '22'
          cache: npm

      - if: steps.keys.outputs.ready == 'yes'
        run: npm ci

      # **이 결과가 그대로 앱에 담긴다**(출시용으로 바꾼 뒤로 그렇다).
      #
      # `VITE_APP_BUILD`는 `내 정보`에 `버전 1.28`로 나오는 그 뒷자리다.
      # **아래 아카이브의 `CURRENT_PROJECT_VERSION`과 같은 값을 준다** —
      # 그래야 화면의 `1.28`과 TestFlight의 `1.0 (28)`이 같은 숫자가 되어,
      # 폰에서 새 앱을 받았는지 그것 하나로 가릴 수 있다.
      # **한쪽만 고치지 말 것.**
      - name: 웹 빌드
        if: steps.keys.outputs.ready == 'yes'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BUILD: ${{ github.run_number }}
        run: npm run build

      # 플러그인을 iOS 쪽에 물리고 CocoaPods를 받는다.
      - name: 앱 껍데기 맞추기
        if: steps.keys.outputs.ready == 'yes'
        run: npx cap sync ios

      # `xcodebuild`가 인증서와 프로비저닝을 **스스로 만들어 받는다**
      # (`-allowProvisioningUpdates`). 맥에서 손으로 만들어 옮길 필요가
      # 없는 것이 이 방식을 고른 까닭이다. 쓰는 곳은 **올리는 단계**다
      # (아래 '아카이브'의 주석 참고).
      - name: 애플 열쇠 놓기
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8

      # **서명은 여기서 안 한다 — 올리는 단계에서 한다.**
      # Xcode의 자동 서명은 아카이브할 때 늘 **개발용** 프로비저닝을 받으러
      # 가는데, 개발용은 **기기를 미리 등록해 둬야** 만들어진다. 우리 팀에는
      # 등록된 기기가 없어(TestFlight로만 쓰므로 등록할 일도 없다) 거기서
      # 멈췄다 — `Your team has no devices from which to generate a
      # provisioning profile`. 배포용을 못박아 봐도 `conflicting provisioning
      # settings`로 거절한다(자동 서명이 고른 개발용과 어긋나서). 둘 다 실제로
      # 겪은 자리다.
      #
      # **앱스토어 배포용 프로비저닝은 기기가 필요 없다.** 그래서 아카이브는
      # 서명 없이 만들고, `-exportArchive`가 그때 인증서와 배포용 프로비저닝을
      # 스스로 만들어 받아 서명해 올린다.
      #
      # **알림을 붙이면서 그 전제가 하나 깨졌다** — 이제 앱에 entitlements
      # 파일이 있는데(`App/App.entitlements`), 서명을 끄면 그 처리 단계도
      # 함께 건너뛴다. 아래 `알림 권한 실어 주기`가 그 자리를 메운다.
      - name: 아카이브 (서명 없이)
        if: steps.keys.outputs.ready == 'yes'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # ── 알림 권한을 아카이브에 실어 준다 ──────────────────────
      #
      # **아카이브를 서명 없이 만드는 것의 대가다**(위 참고). 서명을 끄면
      # Xcode가 `entitlements`를 처리하는 단계도 함께 건너뛰어, 앱 안에
      # `archived-expanded-entitlements.xcent`가 안 생긴다. 그러면 아래
      # `-exportArchive`가 다시 서명할 때 **넣을 권한이 없어** 알림 권한
      # (`aps-environment`)이 빠진 앱이 만들어진다 — 빌드는 초록이고
      # TestFlight에도 올라가는데 **폰에서 알림 등록만 조용히 거절당한다.**
      #
      # 그래서 그 파일을 우리가 직접 넣어 준다. `-exportArchive`는 이 파일이
      # 있으면 그걸 권한으로 삼아 서명한다.
      #
      # **`expanded`가 이름값을 한다 — 통째로 다 적어야 먹는다.**
      # `App.entitlements`를 그대로 복사해 두었더니(= `aps-environment` 한
      # 줄뿐) `-exportArchive`가 그 파일을 **통째로 버리고** 프로파일에서
      # 뽑은 넷(`application-identifier`·`team-identifier`·`get-task-allow`·
      # `beta-reports-active`)으로만 서명했다 — 37판 진단에서
      # `서명 파일에는 알림 권한이 있다`인데 앱에는 없는 것으로 갈렸다.
      # Xcode가 여기 적는 것은 **변수까지 다 풀어 놓은 최종 목록**이라,
      # 그 넷이 빠져 있으면 쓸 수 없는 파일로 본다.
      #
      # 그래서 넷을 함께 적는다. **앱 쪽 권한의 원본은 그대로
      # `ios/App/App/App.entitlements`다** — 여기서는 그 값을 꺼내 쓴다
      # (두 군데에 적어 두면 한쪽만 고치게 된다).
      #
      # **여기서 확인하지 말 것 — 방금 우리가 넣은 파일을 우리가 보는 꼴이라
      # 늘 통과한다.** 실제로 그렇게 두었다가 빌드가 내내 초록인데 폰에서만
      # `유효한 aps-environment 인타이틀먼트 문자열을 찾을 수 없습니다`가
      # 떴다(사용자 제보 · 1.34판). **진짜 확인은 서명이 끝난 뒤**에 있다
      # (아래 `알림 권한이 진짜 실렸는지`).
      - name: 알림 권한 실어 주기
        if: steps.keys.outputs.ready == 'yes'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          APS=$(plutil -extract aps-environment raw -o - ios/App/App/App.entitlements)
          BID=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")
          cat > "$APP/archived-expanded-entitlements.xcent" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>$TEAM_ID.$BID</string>
            <key>com.apple.developer.team-identifier</key><string>$TEAM_ID</string>
            <key>get-task-allow</key><false/>
            <key>beta-reports-active</key><true/>
            <key>aps-environment</key><string>$APS</string>
          </dict></plist>
          PLIST
          plutil -lint "$APP/archived-expanded-entitlements.xcent"

      # ── 서명은 두 번 한다 — 먼저 파일로 뽑아 보고, 그다음 올린다 ────
      #
      # **`destination: upload`는 `exportPath`에 아무것도 안 남긴다.**
      # 올리고 지운다 — 그래서 서명 결과를 볼 방법이 없었고, 검사를 뒤에
      # 붙여 봐야 `서명된 파일이 없어 건너뜁니다`로 조용히 지나갔다
      # (35판에서 실제로 그랬다).
      #
      # 그래서 **`export`로 한 번 뽑아** 권한을 확인하고, 통과한 뒤에
      # `upload`로 다시 내보낸다. 서명이 한 번 더 도는 값(2분쯤)을
      # 치르는 대신, **올리기 전에** 잘못된 앱을 붙잡는다 —
      # 빌드 번호를 헛되이 태우지 않는다.
      - name: 서명해서 파일로 뽑기
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          make_plist() {
            cat > "$RUNNER_TEMP/Export-$1.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>$1</string>
          </dict></plist>
          PLIST
          }
          make_plist export
          make_plist upload
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/Export-export.plist" \
            -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # ── 알림 권한이 진짜 실렸는지 ─────────────────────────────
      #
      # **서명이 끝난 앱을 본다.** 앞에서 `.xcent`를 넣어 두어도, 실제로
      # 권한을 주는 것은 **애플이 내주는 프로비저닝 프로파일**이다 —
      # `com.kkakkung.app`의 App ID에 **Push Notifications가 꺼져 있으면**
      # 그 프로파일에 `aps-environment`가 없고, 서명할 때 통째로 빠진다.
      # 빌드는 초록이고 TestFlight에도 올라가는데 **폰에서 알림 등록만
      # 거절당한다**(사용자 제보 · 1.34판).
      #
      # **여기서 못 찾으면 올리지 않고 멈춘다** — 무엇을 켜야 하는지 적어서.
      - name: 알림 권한이 진짜 실렸는지
        if: steps.keys.outputs.ready == 'yes'
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP/out"/*.ipa 2>/dev/null | head -1 || true)
          [ -n "$IPA" ] || { echo "::error::서명된 파일(.ipa)이 안 나왔습니다."; exit 1; }
          rm -rf "$RUNNER_TEMP/peek" && mkdir -p "$RUNNER_TEMP/peek"
          unzip -q "$IPA" -d "$RUNNER_TEMP/peek"
          SIGNED=$(ls -d "$RUNNER_TEMP/peek/Payload"/*.app | head -1)

          # **애플이 내준 서명 파일부터 본다 — 두 갈래를 가르는 자리다.**
          # 여기에 `aps-environment`가 있는데 앱에 없으면 우리 쪽 셈이
          # 틀린 것이고, 여기에도 없으면 **App ID에 Push Notifications가
          # 안 켜진 것**이다. 둘을 안 가르면 엉뚱한 데를 고치게 된다.
          echo "── 애플이 내준 서명 파일(embedded.mobileprovision) ──"
          security cms -D -i "$SIGNED/embedded.mobileprovision" 2>/dev/null \
            > "$RUNNER_TEMP/prof.plist" || true
          plutil -p "$RUNNER_TEMP/prof.plist" \
            | grep -Ei 'Name|aps-environment|application-identifier' || true
          grep -q 'aps-environment' "$RUNNER_TEMP/prof.plist" \
            && echo "→ 서명 파일에는 알림 권한이 있다" \
            || echo "→ 서명 파일에 알림 권한이 없다 (App ID 쪽이다)"

          echo "── 서명된 앱의 권한 ──"
          codesign -d --entitlements :- "$SIGNED" 2>/dev/null > "$RUNNER_TEMP/ent.txt" || true
          cat "$RUNNER_TEMP/ent.txt"
          if grep -q 'aps-environment' "$RUNNER_TEMP/ent.txt"; then
            echo "알림 권한이 앱에 실렸습니다."
            exit 0
          fi

          # **어느 쪽이 빠졌는지에 따라 고칠 자리가 다르다** — 둘을 한 문구로
          # 뭉뚱그리면 엉뚱한 데를 고치게 된다(37판에서 실제로 그럴 뻔했다).
          if grep -q 'aps-environment' "$RUNNER_TEMP/prof.plist"; then
            echo "::error::애플이 내준 서명 파일에는 알림 권한이 있는데 앱에 안 붙었습니다. \
          워크플로의 \`알림 권한 실어 주기\` 단계를 볼 것 — 사람이 할 일은 없습니다."
          else
            echo "::error::서명된 앱에 알림 권한(aps-environment)이 없습니다. \
          developer.apple.com → Certificates, IDs & Profiles → Identifiers → \
          com.kkakkung.app 에서 Push Notifications를 켜고 Save한 뒤 다시 돌려 주세요."
          fi
          exit 1

      # **빌드 번호는 올릴 때마다 달라야 한다** — 같은 번호를 두 번 올리면
      # 애플이 거절한다. `github.run_number`가 저절로 하나씩 오르므로
      # 사람이 챙길 것이 없다(아카이브 단계에서 함께 준다).
      - name: TestFlight로 보내기
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/Export-upload.plist" \
            -exportPath "$RUNNER_TEMP/sent" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 열쇠 지우기
        if: always()
        run: rm -rf ~/private_keys
