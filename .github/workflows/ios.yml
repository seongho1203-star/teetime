name: 아이폰 앱 (TestFlight)

# 맥 없이 아이폰 앱을 만들어 TestFlight로 보낸다.
# **저장소가 공개라 GitHub의 macOS 러너가 공짜다** — 그게 맥을 안 사도 되는
# 까닭이다. 절차와 넣을 비밀값은 `docs/출시-전-할일.md` 0-3번에 있다.
#
# **이제는 화면 고침도 이걸 돌려야 앱에 닿는다.** 출시용으로 바꾸면서
# `npm run build`가 만든 `dist`가 앱 안에 담기게 됐다(`capacitor.config.ts`의
# `server` 덩어리를 지웠다) — 밀기만 하면 폰에 바로 보이던 때와 다르다.
# 그래서 `paths`에 없는 파일만 고쳤을 때는 **손으로 돌려야 한다**
# (Actions 탭 → 이 워크플로 → Run workflow). 웹(GitHub Pages)은 예전처럼
# 밀면 저절로 올라간다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

# 두 판이 겹치면 TestFlight에 같은 번호가 두 번 올라가 뒤엣것이 거절된다.
concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # **비밀값이 없으면 조용히 지나간다** — 아직 안 넣어 두었을 때
      # 빨간 X만 쌓이면 안 된다. 다만 단추를 눌러 손으로 돌린 것은
      # 알고 싶어서 누른 것이므로 그때는 또렷이 알린다.
      - id: keys
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::애플 비밀값 넷이 다 있어야 합니다 (APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8 · APPLE_TEAM_ID). docs/출시-전-할일.md 0-3번 참고."
            exit 1
          else
            echo "::notice::애플 비밀값이 아직 없어 건너뜁니다."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.keys.outputs.ready == 'yes'
        with:
          node-version: '22'
          cache: npm

      - if: steps.keys.outputs.ready == 'yes'
        run: npm ci

      # **이 결과가 그대로 앱에 담긴다**(출시용으로 바꾼 뒤로 그렇다).
      #
      # `VITE_APP_BUILD`는 `내 정보`에 `버전 1.28`로 나오는 그 뒷자리다.
      # **아래 아카이브의 `CURRENT_PROJECT_VERSION`과 같은 값을 준다** —
      # 그래야 화면의 `1.28`과 TestFlight의 `1.0 (28)`이 같은 숫자가 되어,
      # 폰에서 새 앱을 받았는지 그것 하나로 가릴 수 있다.
      # **한쪽만 고치지 말 것.**
      - name: 웹 빌드
        if: steps.keys.outputs.ready == 'yes'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BUILD: ${{ github.run_number }}
        run: npm run build

      # 플러그인을 iOS 쪽에 물리고 CocoaPods를 받는다.
      - name: 앱 껍데기 맞추기
        if: steps.keys.outputs.ready == 'yes'
        run: npx cap sync ios

      # `xcodebuild`가 인증서와 프로비저닝을 **스스로 만들어 받는다**
      # (`-allowProvisioningUpdates`). 맥에서 손으로 만들어 옮길 필요가
      # 없는 것이 이 방식을 고른 까닭이다. 쓰는 곳은 **올리는 단계**다
      # (아래 '아카이브'의 주석 참고).
      - name: 애플 열쇠 놓기
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8

      # **서명은 여기서 안 한다 — 올리는 단계에서 한다.**
      # Xcode의 자동 서명은 아카이브할 때 늘 **개발용** 프로비저닝을 받으러
      # 가는데, 개발용은 **기기를 미리 등록해 둬야** 만들어진다. 우리 팀에는
      # 등록된 기기가 없어(TestFlight로만 쓰므로 등록할 일도 없다) 거기서
      # 멈췄다 — `Your team has no devices from which to generate a
      # provisioning profile`. 배포용을 못박아 봐도 `conflicting provisioning
      # settings`로 거절한다(자동 서명이 고른 개발용과 어긋나서). 둘 다 실제로
      # 겪은 자리다.
      #
      # **앱스토어 배포용 프로비저닝은 기기가 필요 없다.** 그래서 아카이브는
      # 서명 없이 만들고, `-exportArchive`가 그때 인증서와 배포용 프로비저닝을
      # 스스로 만들어 받아 서명해 올린다.
      #
      # **알림을 붙이면서 그 전제가 하나 깨졌다** — 이제 앱에 entitlements
      # 파일이 있는데(`App/App.entitlements`), 서명을 끄면 그 처리 단계도
      # 함께 건너뛴다. 아래 `알림 권한을 붙여 다시 서명`이 그 자리를 메운다.
      - name: 아카이브 (서명 없이)
        if: steps.keys.outputs.ready == 'yes'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # ── 아카이브 안의 앱에 임시 서명을 얹는다 ──────────────────
      #
      # **`-exportArchive`가 권한을 어디서 읽는지가 이 자리의 전부다.**
      # 아카이브가 서명돼 있지 않으면 프로파일의 **바탕 넷**만 쓰고
      # 앱이 뭘 달라는지는 안 본다 — 그래서 `aps-environment`가 매번 빠졌다.
      # `archived-expanded-entitlements.xcent`를 넣어 봐도 안 본다
      # (37·38판에서 한 줄짜리·다섯 줄짜리 둘 다 헛일이었다. **다시 넣지 말 것.**)
      #
      # **임시 서명(ad-hoc, `-s -`)은 인증서가 없어도 된다.** 권한을 실어
      # 한 번 서명해 두면 앱이 **제가 무엇을 달라는지 들고 있게** 되고,
      # `-exportArchive`가 다시 서명할 때 그걸 읽는다.
      #
      # 바탕 넷까지 함께 적는 것은 Xcode가 이 목록을 **그대로** 쓸 때를
      # 대비한 것이다 — `aps-environment` 한 줄만 두면 그 판에서
      # `application-identifier`가 없는 앱이 되어 설치가 통째로 막힌다.
      - name: 아카이브에 권한을 실어 임시 서명
        if: steps.keys.outputs.ready == 'yes'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          APS=$(plutil -extract aps-environment raw -o - ios/App/App/App.entitlements)
          BID=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Info.plist")
          cat > "$RUNNER_TEMP/adhoc.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>application-identifier</key><string>$TEAM_ID.$BID</string>
            <key>com.apple.developer.team-identifier</key><string>$TEAM_ID</string>
            <key>get-task-allow</key><false/>
            <key>beta-reports-active</key><true/>
            <key>aps-environment</key><string>$APS</string>
          </dict></plist>
          PLIST
          codesign -f -s - --entitlements "$RUNNER_TEMP/adhoc.plist" \
            --generate-entitlement-der "$APP"
          echo "── 임시 서명 뒤 앱이 들고 있는 권한 ──"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true

      # ── 파일로 뽑는다 (`export`, 올리지 않는다) ────────────────
      #
      # **`destination: upload`를 쓰지 않는다.** 그건 `exportPath`에
      # 아무것도 안 남기고(올리고 지운다) 곧바로 올려 버려서, 서명 결과를
      # 볼 수도 고칠 수도 없다 — 검사를 뒤에 붙여 봐야
      # `서명된 파일이 없어 건너뜁니다`로 조용히 지나갔다(35판).
      #
      # 그래서 여기서는 **파일로만 뽑는다.** 알림 권한을 붙여 다시 서명하고
      # (다음 단계), 확인한 뒤에 그 파일을 그대로 올린다.
      #
      # **이 단계가 인증서와 프로비저닝을 받아 오는 자리이기도 하다** —
      # 다음 단계의 다시 서명이 그 둘에 기댄다.
      - name: 서명해서 파일로 뽑기
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          make_plist() {
            cat > "$RUNNER_TEMP/Export-$1.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>$1</string>
          </dict></plist>
          PLIST
          }
          make_plist export
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/Export-export.plist" \
            -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # ── 권한이 빠졌으면 우리가 붙여 다시 서명한다 (예비 길) ────
      #
      # 위의 임시 서명이 먹었으면 `-exportArchive`가 이미 제대로 서명해
      # 놓았을 것이다 — 그때는 **아무것도 안 하고 그 파일을 그대로 쓴다.**
      # 안 먹었을 때만 우리가 직접 붙인다.
      #
      # **인증서가 `security`에 안 보일 수 있다** — 40판에서
      # `0 valid identities found`인데도 앱은 멀쩡히 서명돼 있었다.
      # Xcode가 제 키체인에 넣고 쓰기 때문이다. 그래서 키체인 파일을
      # 하나씩 다 뒤진다.
      - name: 권한이 빠졌으면 붙여 다시 서명
        if: steps.keys.outputs.ready == 'yes'
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP/out"/*.ipa 2>/dev/null | head -1 || true)
          [ -n "$IPA" ] || { echo "::error::서명된 파일(.ipa)이 안 나왔습니다."; exit 1; }
          W="$RUNNER_TEMP/resign"
          rm -rf "$W" && mkdir -p "$W"
          unzip -q "$IPA" -d "$W"
          APP=$(ls -d "$W/Payload"/*.app | head -1)

          echo "── 뽑아 놓은 앱의 권한 ──"
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$W/now.txt" || true
          cat "$W/now.txt"
          if grep -q 'aps-environment' "$W/now.txt"; then
            echo "이미 제대로 서명돼 있습니다 — 다시 서명하지 않습니다."
            cp "$IPA" "$RUNNER_TEMP/kkakkung.ipa"
            exit 0
          fi

          echo "── 없어서 직접 붙입니다 ──"
          security cms -D -i "$APP/embedded.mobileprovision" > "$W/prof.plist"
          plutil -extract Entitlements xml1 -o "$W/ent.plist" "$W/prof.plist"
          plutil -p "$W/ent.plist"
          grep -q 'aps-environment' "$W/ent.plist" || {
            echo "::error::애플이 내준 서명 파일에 알림 권한이 없습니다. \
          developer.apple.com → Certificates, IDs & Profiles → Identifiers → \
          com.kkakkung.app 에서 Push Notifications를 켜고 Save한 뒤 다시 돌려 주세요."
            exit 1
          }

          # **키체인을 하나씩 다 뒤진다** — 기본 목록에 없을 수 있다(40판).
          ID=""; KC=""
          for k in ~/Library/Keychains/* /Library/Keychains/*; do
            case "$k" in *.keychain|*.keychain-db) ;; *) continue ;; esac
            found=$(security find-identity -v -p codesigning "$k" 2>/dev/null \
                    | sed -n 's/.*"\(.*Distribution:[^"]*\)".*/\1/p' | head -1)
            echo "  $k → ${found:-(없음)}"
            if [ -z "$ID" ] && [ -n "$found" ]; then ID="$found"; KC="$k"; fi
          done
          [ -n "$ID" ] || { echo "::error::배포용 인증서를 어느 키체인에서도 못 찾았습니다."; exit 1; }
          echo "서명 인증서: $ID  ($KC)"

          codesign -f -s "$ID" --keychain "$KC" --entitlements "$W/ent.plist" \
            --generate-entitlement-der --timestamp=none "$APP"

          # **`ditto`로 다시 묶는다** — `zip`은 맥 번들의 심볼릭 링크를
          # 제대로 못 담는 판이 있다. `--keepParent`가 `Payload/`를 그대로
          # 맨 위에 두는 몫이다(그 짜임이 곧 `.ipa`다).
          rm -f "$RUNNER_TEMP/kkakkung.ipa"
          ( cd "$W" && ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/kkakkung.ipa" )
          ls -l "$RUNNER_TEMP/kkakkung.ipa"

      # ── 알림 권한이 진짜 실렸는지 ─────────────────────────────
      #
      # **올리기 전에, 다시 서명한 그 파일을 읽어 본다.** 앞 단계가 조용히
      # 어긋나도 여기서 걸린다 — 빌드는 초록인데 폰에서만 등록이 거절되던
      # 자국(1.34판)을 다시 만들지 않으려는 자리다.
      - name: 알림 권한이 진짜 실렸는지
        if: steps.keys.outputs.ready == 'yes'
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/peek" && mkdir -p "$RUNNER_TEMP/peek"
          unzip -q "$RUNNER_TEMP/kkakkung.ipa" -d "$RUNNER_TEMP/peek"
          SIGNED=$(ls -d "$RUNNER_TEMP/peek/Payload"/*.app | head -1)
          codesign -v --deep --strict "$SIGNED" && echo "서명 확인 ok"
          codesign -d --entitlements :- "$SIGNED" 2>/dev/null > "$RUNNER_TEMP/ent.txt" || true
          cat "$RUNNER_TEMP/ent.txt"
          grep -q 'aps-environment' "$RUNNER_TEMP/ent.txt" \
            || { echo "::error::다시 서명했는데도 알림 권한이 없습니다."; exit 1; }
          echo "알림 권한이 앱에 실렸습니다."

      # ── TestFlight로 보낸다 ───────────────────────────────────
      #
      # **`xcodebuild -exportArchive`로 올리지 않는다.** 그건 아카이브에서
      # 다시 서명해 올리므로, 방금 우리가 붙인 권한이 도로 날아간다.
      # 그래서 **다시 서명한 그 파일을 그대로** `altool`로 올린다.
      #
      # 열쇠는 `~/private_keys/AuthKey_<KEY_ID>.p8`에 있고, `altool`이
      # 그 자리를 스스로 찾는다(`--apiKey`에 이름만 준다).
      #
      # **빌드 번호는 올릴 때마다 달라야 한다** — 같은 번호를 두 번 올리면
      # 애플이 거절한다. `github.run_number`가 저절로 하나씩 오르므로
      # 사람이 챙길 것이 없다(아카이브 단계에서 함께 준다).
      - name: TestFlight로 보내기
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app -f "$RUNNER_TEMP/kkakkung.ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: 열쇠 지우기
        if: always()
        run: rm -rf ~/private_keys
