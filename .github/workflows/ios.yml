name: 아이폰 앱 (TestFlight)

# 맥 없이 아이폰 앱을 만들어 TestFlight로 보낸다.
# **저장소가 공개라 GitHub의 macOS 러너가 공짜다** — 그게 맥을 안 사도 되는
# 까닭이다. 절차와 넣을 비밀값은 `docs/출시-전-할일.md` 0-3번에 있다.
#
# **이제는 화면 고침도 이걸 돌려야 앱에 닿는다.** 출시용으로 바꾸면서
# `npm run build`가 만든 `dist`가 앱 안에 담기게 됐다(`capacitor.config.ts`의
# `server` 덩어리를 지웠다) — 밀기만 하면 폰에 바로 보이던 때와 다르다.
# 그래서 `paths`에 없는 파일만 고쳤을 때는 **손으로 돌려야 한다**
# (Actions 탭 → 이 워크플로 → Run workflow). 웹(GitHub Pages)은 예전처럼
# 밀면 저절로 올라간다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

# 두 판이 겹치면 TestFlight에 같은 번호가 두 번 올라가 뒤엣것이 거절된다.
concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # **비밀값이 없으면 조용히 지나간다** — 아직 안 넣어 두었을 때
      # 빨간 X만 쌓이면 안 된다. 다만 단추를 눌러 손으로 돌린 것은
      # 알고 싶어서 누른 것이므로 그때는 또렷이 알린다.
      - id: keys
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::애플 비밀값 넷이 다 있어야 합니다 (APPSTORE_KEY_ID · APPSTORE_ISSUER_ID · APPSTORE_KEY_P8 · APPLE_TEAM_ID). docs/출시-전-할일.md 0-3번 참고."
            exit 1
          else
            echo "::notice::애플 비밀값이 아직 없어 건너뜁니다."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.keys.outputs.ready == 'yes'
        with:
          node-version: '22'
          cache: npm

      - if: steps.keys.outputs.ready == 'yes'
        run: npm ci

      # **이 결과가 그대로 앱에 담긴다**(출시용으로 바꾼 뒤로 그렇다).
      #
      # `VITE_APP_BUILD`는 `내 정보`에 `버전 1.28`로 나오는 그 뒷자리다.
      # **아래 아카이브의 `CURRENT_PROJECT_VERSION`과 같은 값을 준다** —
      # 그래야 화면의 `1.28`과 TestFlight의 `1.0 (28)`이 같은 숫자가 되어,
      # 폰에서 새 앱을 받았는지 그것 하나로 가릴 수 있다.
      # **한쪽만 고치지 말 것.**
      - name: 웹 빌드
        if: steps.keys.outputs.ready == 'yes'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BUILD: ${{ github.run_number }}
        run: npm run build

      # 플러그인을 iOS 쪽에 물리고 CocoaPods를 받는다.
      - name: 앱 껍데기 맞추기
        if: steps.keys.outputs.ready == 'yes'
        run: npx cap sync ios

      # `xcodebuild`가 인증서와 프로비저닝을 **스스로 만들어 받는다**
      # (`-allowProvisioningUpdates`). 맥에서 손으로 만들어 옮길 필요가
      # 없는 것이 이 방식을 고른 까닭이다. 쓰는 곳은 **올리는 단계**다
      # (아래 '아카이브'의 주석 참고).
      - name: 애플 열쇠 놓기
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$KEY_ID.p8

      # **서명은 여기서 안 한다 — 올리는 단계에서 한다.**
      # Xcode의 자동 서명은 아카이브할 때 늘 **개발용** 프로비저닝을 받으러
      # 가는데, 개발용은 **기기를 미리 등록해 둬야** 만들어진다. 우리 팀에는
      # 등록된 기기가 없어(TestFlight로만 쓰므로 등록할 일도 없다) 거기서
      # 멈췄다 — `Your team has no devices from which to generate a
      # provisioning profile`. 배포용을 못박아 봐도 `conflicting provisioning
      # settings`로 거절한다(자동 서명이 고른 개발용과 어긋나서). 둘 다 실제로
      # 겪은 자리다.
      #
      # **앱스토어 배포용 프로비저닝은 기기가 필요 없다.** 그래서 아카이브는
      # 서명 없이 만들고, `-exportArchive`가 그때 인증서와 배포용 프로비저닝을
      # 스스로 만들어 받아 서명해 올린다. 앱에 entitlements 파일이 없어
      # (푸시·특수 권한을 안 쓴다) 서명을 미뤄도 잃는 것이 없다.
      - name: 아카이브 (서명 없이)
        if: steps.keys.outputs.ready == 'yes'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # **여기가 서명하는 자리다.** `-allowProvisioningUpdates`가 배포용
      # 인증서와 앱스토어 프로비저닝을 스스로 만들어 받아 앱에 서명하고,
      # `destination: upload`라 그대로 TestFlight까지 올린다.
      #
      # **빌드 번호는 올릴 때마다 달라야 한다** — 같은 번호를 두 번 올리면
      # 애플이 거절한다. `github.run_number`가 저절로 하나씩 오르므로
      # 사람이 챙길 것이 없다(위 아카이브 단계에서 함께 준다).
      - name: 서명해서 TestFlight로 보내기
        if: steps.keys.outputs.ready == 'yes'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/Export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/Export.plist" \
            -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: 열쇠 지우기
        if: always()
        run: rm -rf ~/private_keys
