# 이모티콘 추천 말(sticker_words)을 읽거나, 정해 둔 말을 한 번 넣는다.
#
# 앱관리자가 앱에서 적는 것이 원본이라 schema.sql에는 안 넣는다 — 거기 두면
# 밀 때마다 다시 돌아 **사용자가 지운 말이 되살아난다.** 손으로 돌릴 때만 돈다.
#   read  — 지금 들어 있는 말을 로그에 적는다
#   apply — supabase/sticker-words.sql 을 한 번 돌린다(이미 있는 줄은 건너뛴다)
name: 이모티콘 추천 말

on:
  workflow_dispatch:
    inputs:
      mode:
        description: read 또는 apply
        required: true
        default: read

jobs:
  words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 읽기 / 넣기
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -z "$DB_URL" ]; then echo "::error::SUPABASE_DB_URL 이 없습니다."; exit 1; fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          if [ "$MODE" = "apply" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/sticker-words.sql
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -A -F '|' -c \
            "select sticker_id, string_agg(word, ',' order by created_at) from sticker_words group by sticker_id order by min(created_at);"
