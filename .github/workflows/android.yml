name: 안드로이드 앱 (AAB · APK)

# 안드로이드 앱을 만든다. 절차와 사용자가 손으로 할 일은
# `docs/출시-전-할일.md` 0-6번에 있다.
#
# **아이폰 워크플로(`ios.yml`)와 다른 점이 셋이다:**
#   1. **맥이 필요 없다** — 우분투에서 그대로 돈다.
#   2. **서명 열쇠가 없어도 만든다.** 아이폰은 애플 열쇠가 없으면 아카이브
#      자체를 못 만들지만, 안드로이드는 **서명 없이도 결과물이 나온다** —
#      그래서 등록비를 내기 전에도 **앱이 제대로 만들어지는지 확인할 수
#      있다.** 서명은 열쇠가 있을 때만 붙는다.
#      **다만 `GOOGLE_SERVICES_JSON`은 없으면 만들지 않는다** — 그건 공짜로
#      받는 것이고, 없이 만들면 알림이 빠진 앱이 조용히 나간다(아래).
#   3. **Play에 저절로 안 올린다.** 첫 판은 어차피 손으로 올려야 앱이
#      만들어진다(아래 `결과물 남기기` 참고).
#      대신 **폰에 바로 깔리는 판(`kkakkung-apk`)을 함께 남긴다** —
#      등록비를 내기 전에 알림과 소리를 확인할 수 있는 유일한 길이다.
#
# **알림에는 `google-services.json`이 있어야 한다.** 안드로이드 알림은
# 구글(FCM)을 반드시 거치고, 그 파일이 없으면 앱은 멀쩡히 만들어지는데
# **폰이 알림 주소(토큰)를 아예 못 받는다.**
# 그래서 **없으면 만들다 멈추고**, 다 만든 뒤에는 **결과물을 열어**
# 알림이 진짜 실렸는지 확인한다 — 아이폰에서 그 '초록인데 실은 알림이
# 빠진 앱'을 여덟 판이나 쫓았다(`ios.yml`의 같은 자리 참고).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

# 두 판이 겹치면 Play에 같은 번호가 두 번 올라가 뒤엣것이 거절된다.
concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # **서명할 수 있는가**만 가린다. 못 해도 만들기는 한다.
      - id: sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            echo "store=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::서명 열쇠가 아직 없어 **서명 없이** 만듭니다. Play에 올리려면 docs/출시-전-할일.md 0-6번을 보세요."
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "store=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # **이 결과가 그대로 앱에 담긴다.** `VITE_APP_BUILD`는 `내 정보`에
      # `버전 1.7`로 나오는 그 뒷자리이고, 아래 `appVersionCode`와 **같은
      # 값을 준다** — 화면의 숫자와 Play에 올라간 번호가 같아야 폰에서
      # 새 앱을 받았는지 그것 하나로 가릴 수 있다.
      # **아이폰과 번호가 다른 것이 정상이다** — 워크플로가 저마다 센다.
      - name: 웹 빌드
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY 시크릿이 없습니다. docs/설치.md 6번 참고."
            exit 1
          fi
          npm run build

      # **알림에 필요한 파일이다**(FCM). 안드로이드 알림은 구글을 반드시
      # 거치고, 이 파일이 없으면 앱은 멀쩡히 만들어지는데 **폰이 알림
      # 주소(토큰)를 아예 못 받는다.**
      # 앱에 박히는 값이라 비밀이라기보다 설정에 가깝지만, 저장소가 공개라
      # 비밀값에 둔다.
      #
      # **없으면 빨갛게 세운다 — 예전에는 노란 줄만 남기고 넘어갔다.**
      # 아이폰에서 그 '초록인데 실은 알림이 빠진 앱'을 여덟 판(34~41)이나
      # 쫓았다. 여기도 같은 함정이라 **만들기 전에** 막는다.
      # 서명 열쇠와는 다르다 — 그건 돈을 내야 생기지만 이건 공짜다.
      - name: 구글 설정 파일 놓기
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::error::GOOGLE_SERVICES_JSON 이 없습니다. 이대로 만들면 \
          앱은 멀쩡한데 알림만 조용히 안 옵니다 — docs/설치.md 7-2번을 보고 \
          파이어베이스에서 google-services.json 을 받아 저장소 비밀값에 넣어 주세요."
            exit 1
          fi
          printf '%s' "$GS" > android/app/google-services.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('android/app/google-services.json'))
          names = [c['client_info']['android_client_info']['package_name']
                   for c in d.get('client', [])]
          print('이 파일에 든 앱:', names or '(없음)')
          # **패키지 이름이 한 글자만 달라도 토큰을 못 받는다.** 파이어베이스에
          # 앱을 등록할 때 제일 자주 틀리는 자리라 여기서 미리 잡는다.
          if 'com.kkakkung.app' not in names:
              print('::error::google-services.json 에 com.kkakkung.app 이 없습니다. '
                    '파이어베이스에서 앱을 등록할 때 패키지 이름을 그대로 넣어 주세요.')
              sys.exit(1)
          PY

      - name: 앱 껍데기 맞추기
        run: npx cap sync android

      # **서명 열쇠를 파일로 놓는다.** 저장소에는 안 두고 비밀값에서 꺼낸다
      # (아이폰이 `.p8`을 그렇게 다루는 것과 같다).
      - name: 서명 열쇠 놓기
        if: steps.sign.outputs.ready == 'yes'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks" \
            || { echo "::error::ANDROID_KEYSTORE_B64 를 못 풀었습니다. base64로 만든 값이 맞는지 보세요."; exit 1; }

      # `bundleRelease`가 **AAB**를 만든다 — Play는 APK가 아니라 이걸 받는다.
      # **열쇠가 없으면 `ANDROID_KEYSTORE_PATH`가 빈 값이고**, 그때
      # `android/app/build.gradle`이 서명을 안 붙인다.
      #
      # **`assembleDebug`를 함께 돌리는 것은 폰에 넣어 보기 위해서다.**
      # 서명 안 된 AAB는 **깔 수도 없고 Play에 올릴 수도 없어**, 등록비를
      # 내기 전에는 만들어 놓고도 확인할 길이 아예 없다. 디버그 판은
      # 안드로이드가 늘 들고 있는 **디버그 열쇠로 저절로 서명**되므로
      # 파일을 폰에 넣어 그대로 깔린다.
      # **패키지 이름이 `com.kkakkung.app` 그대로라**(`build.gradle`에
      # `applicationIdSuffix`가 없다) `google-services.json`도 그대로 먹어
      # **알림과 까꿍 소리까지 여기서 확인된다.**
      # 50초쯤 더 걸리는 것이 전부이고, Play에 올리는 것은 여전히 AAB다.
      - name: 앱 만들기 (AAB · 폰에 넣어 볼 APK)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.sign.outputs.store }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.${{ github.run_number }}

      # ── 알림이 진짜 실렸는지 ──────────────────────────────────
      #
      # **만들어 놓은 결과물을 직접 읽어 본다.** 앞 단계에서 파일을 놓아
      # 두어도 Gradle 쪽 배선이 어긋나면 **플러그인이 조용히 안 돌고**
      # 알림만 빠진 앱이 나온다(`android/app/build.gradle`이 파일이 있을
      # 때만 플러그인을 붙이는 짜임이라 더 그렇다).
      #
      # **우리가 넣은 것을 우리가 다시 보면 안 된다** — 아이폰에서 그 검사가
      # 늘 통과해 두 판을 헛돌았다. 그래서 여기서는 **빌드가 뱉어 놓은 것**
      # 둘을 본다: 플러그인이 만들어 낸 `google_app_id`와, AAB 안에 들어간
      # 알림 권한.
      # **값을 잡는 자리마다 `|| true`를 붙인다.** `find`·`grep`·`ls`는 못
      # 찾으면 1을 돌려주는데, `pipefail`이 걸린 `bash -e`에서는 그것이
      # **다음 줄에 닿기도 전에** 스크립트를 끝낸다 — 우리가 적어 둔 오류
      # 문구도 못 보고 `exit code 1` 한 줄만 남는다. 2~4판이 실제로 그렇게
      # 섰다(아이폰에서 `grep`으로 겪은 그 자리와 같다).
      - name: 알림이 진짜 실렸는지
        run: |
          set -o pipefail

          echo "── 구글 플러그인이 만들어 낸 값 ──"
          # **자리를 못박지 말 것.** 예전에는
          # `build/generated/res/google-services`를 바로 가리켰는데,
          # google-services 4.4부터는 **task 이름이 들어간 자리**
          # (`.../res/processReleaseGoogleServices/values/`)로 옮겼다 —
          # 그래서 알림이 멀쩡히 실린 앱에서도 이 검사만 빨갛게 섰다.
          # 판이 올라도 안 깨지게 **`google_app_id`가 적힌 파일을 찾는다.**
          # **Release 것을 먼저 고른다.** 디버그 판(폰에 넣어 볼 APK)도 같이
          # 만들면서 `processDebugGoogleServices` 자리가 함께 생기는데,
          # 그것을 집으면 **Play에 올릴 판을 안 보고 통과하게 된다.**
          RES=$(grep -rl 'google_app_id' android/app/build/generated 2>/dev/null \
                | grep -i 'release' | head -1 || true)
          [ -n "$RES" ] || RES=$(grep -rl 'google_app_id' android/app/build/generated 2>/dev/null | head -1 || true)
          [ -n "$RES" ] || { echo "::error::구글 설정 플러그인이 안 돌았거나 \
          google_app_id 가 안 만들어졌습니다 — android/app/build.gradle 의 \
          google-services 배선과, google-services.json 이 이 앱\
          (com.kkakkung.app) 것이 맞는지 보세요."; exit 1; }
          echo "찾음: $RES"

          AAB=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
          [ -n "$AAB" ] || { echo "::error::AAB 가 안 만들어졌습니다."; exit 1; }

          # 매니페스트는 글자가 아니라 눌러 담긴 모양이다(AXML). 글자가
          # UTF-16으로 들어 있으면 사이사이 `\0`이 끼어 `grep`이 못 찾으므로,
          # **널을 걷어내고** 본다 — `grep -a`만으로는 판에 따라 헛짚는다.
          MAN=$(unzip -p "$AAB" base/manifest/AndroidManifest.xml 2>/dev/null | tr -d '\0' || true)
          [ -n "$MAN" ] || { echo "::error::AAB 에서 매니페스트를 못 읽었습니다."; exit 1; }

          echo "── AAB 안의 알림 권한 ──"
          echo "$MAN" | grep -a -q 'POST_NOTIFICATIONS' \
            || { echo "::error::AAB 에 알림 권한(POST_NOTIFICATIONS)이 없습니다."; exit 1; }

          # ── 알림음 ──
          #
          # **소리는 채널에 박히고 채널은 `res/raw`의 이 파일을 가리킨다**
          # (`MainActivity.createNotifyChannel`). 파일이 안 실리면 빌드는
          # 초록인데 폰에서만 **조용히 기본음**이 난다 — 아이폰에서 여덟 판을
          # 쫓은 그 '초록인데 실은 안 되는' 자리와 똑같다.
          # `R.raw.kkakkung`으로 가리키므로 이름이 틀리면 컴파일이 먼저 서고,
          # 여기서는 **정말 담겼는지**만 본다.
          echo "── AAB 안의 알림음 ──"
          unzip -l "$AAB" | grep -q 'res/raw/kkakkung' \
            || { echo "::error::AAB 에 알림음(res/raw/kkakkung.wav)이 없습니다."; exit 1; }

          # ── 기본 채널·아이콘 ──
          #
          # 앱이 꺼져 있을 때 오는 알림은 우리 코드가 아니라 파이어베이스
          # SDK가 띄우므로, 이 둘이 빠지면 **기본음 + 흰 네모**가 된다.
          echo "── 기본 채널·아이콘 ──"
          echo "$MAN" | grep -a -q 'default_notification_channel_id' \
            || { echo "::error::기본 알림 채널이 매니페스트에 없습니다 — \
          까꿍 소리 대신 폰 기본음이 납니다."; exit 1; }
          echo "$MAN" | grep -a -q 'default_notification_icon' \
            || { echo "::error::기본 알림 아이콘이 매니페스트에 없습니다 — \
          상태 막대에 흰 네모가 뜹니다."; exit 1; }

          echo "알림 권한 · 구글 설정 · 알림음 · 기본 채널/아이콘 다 들어 있습니다."

      # **Play에 저절로 올리는 것은 아직 안 붙였다.**
      #
      # 올리려면 Play Console에 **앱이 이미 만들어져 있고** 그 계정에 딸린
      # 서비스 계정 열쇠가 있어야 하는데, 그건 등록비($25)를 내고 앱을 만든
      # **뒤에야** 생긴다. 있지도 않은 것을 부르는 단계를 미리 넣어 두면
      # **돌릴 때마다 빨갛게 실패한다.**
      #
      # 그래서 지금은 **결과물을 남겨 둔다** — 이 실행 화면 아래
      # `kkakkung-aab`를 받아 Play Console에 올리면 된다. 어차피 **첫 판은
      # 손으로 올려야** 앱이 만들어진다. 그다음부터 저절로 올리는 단계를
      # 붙이면 되고, 그때 필요한 것은 `docs/출시-전-할일.md` 0-6번에 있다.
      - name: 결과물 남기기 (Play에 올릴 AAB)
        uses: actions/upload-artifact@v4
        with:
          name: kkakkung-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # **폰에 바로 넣어 보는 파일이다.** 위 AAB는 Play를 거쳐야 깔리는데,
      # 이것은 받아서 안드로이드 폰에 넣고 누르면 그대로 깔린다 —
      # 등록비를 내기 전에 **알림과 까꿍 소리를 확인할 수 있는 유일한 길**이다.
      # (`설정 → 출처를 알 수 없는 앱`을 한 번 열어 줘야 한다.)
      # **Play에는 이 파일을 올리지 말 것** — 디버그 열쇠로 서명된 것이라
      # 스토어가 안 받는다.
      - name: 결과물 남기기 (폰에 넣어 볼 APK)
        uses: actions/upload-artifact@v4
        with:
          name: kkakkung-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
